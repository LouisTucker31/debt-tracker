<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debt Tracker</title>
<meta name="description" content="Track credit card balances, payments and payoff projections.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2563EB">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Debt Tracker">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Lock screen: a local access deterrent, not real security. The code
     is a plain constant in js/main.js and is trivially readable via
     browser dev tools; it only discourages a casual glance. -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <h1 class="lock-title">Debt Tracker</h1>
    <p class="lock-subtitle">Enter your code to continue</p>
    <label for="lockCodeInput" class="lock-label">Access code</label>
    <input id="lockCodeInput" class="lock-input" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-describedby="lockError">
    <p class="lock-error" id="lockError" role="alert" hidden>Incorrect code. Try again.</p>
    <button type="button" class="btn primary full" id="lockUnlockBtn" data-action="unlock">Unlock</button>
  </div>
</div>

<div id="app" inert aria-hidden="true">

<header class="app-header">
  <div class="header-top">
    <div class="header-titles">
      <h1>Debt Tracker</h1>
      <div class="today" id="todayLabel"></div>
    </div>
    <button class="header-add-btn" id="fabAdd" aria-label="Add card"></button>
  </div>
  <div class="summary-row" id="summaryRow"></div>
</header>

<main>
  <div id="installTip"></div>
  <div id="cardsArea"></div>
</main>

</div>

<!-- Card detail overlay -->
<div class="overlay" id="detailOverlay">
  <div class="overlay-header">
    <button class="icon-btn" id="detailBack">‹ Back</button>
    <div class="overlay-title" id="detailTitle"></div>
    <button class="icon-btn" id="detailEdit">Edit</button>
  </div>
  <div class="overlay-body" id="detailBody"></div>
</div>

<!-- Add / edit card form overlay -->
<div class="overlay" id="cardFormOverlay">
  <div class="overlay-header">
    <button class="icon-btn" id="cardFormCancel">Cancel</button>
    <div class="overlay-title" id="cardFormTitle">Add card</div>
    <button class="icon-btn" id="cardFormSave">Save</button>
  </div>
  <div class="overlay-body" id="cardFormBody"></div>
</div>

<!-- Payment / charge form overlay -->
<div class="overlay" id="txFormOverlay">
  <div class="overlay-header">
    <button class="icon-btn" id="txFormCancel">Cancel</button>
    <div class="overlay-title" id="txFormTitle"></div>
    <button class="icon-btn" id="txFormSave">Save</button>
  </div>
  <div class="overlay-body" id="txFormBody"></div>
</div>

<!-- Confirmation dialog: replaces window.confirm() for closing, deleting
     and paid-off prompts, per project accessibility requirements. -->
<dialog id="confirmDialog" class="confirm-dialog">
  <p id="confirmMessage"></p>
  <div class="dialog-actions">
    <button type="button" class="btn" id="confirmCancelBtn">Cancel</button>
    <button type="button" class="btn primary" id="confirmOkBtn">Confirm</button>
  </div>
</dialog>

<script src="./main.js" defer></script>
</body>
</html>
